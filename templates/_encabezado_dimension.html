{# Encabezado común de los tableros. Uso: {% include "_encabezado_dimension.html" %} #}
<section class="encabezado-pagina">
  <span class="etiqueta aparecer"><i class="bi {{ dim.icono }}"></i> Integrante {{ dim.integrante }}</span>
  <h1 class="mt-3 aparecer" style="--retraso: .1s">{{ dim.nombre }}</h1>
  <p class="pregunta mt-3 aparecer" style="--retraso: .2s">{{ dim.pregunta }}</p>
</section>
