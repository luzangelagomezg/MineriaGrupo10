<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Presuntos Homicidios Colombia{% endblock %} · Grupo 10</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="fondo-animado" aria-hidden="true"></div>

  <nav class="navbar navbar-expand-lg navbar-grupo">
    <div class="container">
      <a class="navbar-brand marca" href="{{ url_for('inicio') }}">
        <span class="marca-icono"><i class="bi bi-activity"></i></span>
        Grupo 10
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false" aria-label="Mostrar menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'inicio' %}active{% endif %}" href="{{ url_for('inicio') }}">Inicio</a>
          </li>
        </ul>
        <a class="btn btn-neon sin-flecha d-none d-lg-inline-flex" href="https://www.datos.gov.co/Justicia-y-Derecho/Presuntos-Homicidios-Colombia-2015-a-2024-Cifras-d/vtub-3de2/about_data"
           target="_blank" rel="noopener">Ver datos</a>
      </div>
    </div>
  </nav>

  <main>
    {% block contenido %}{% endblock %}
  </main>

  <footer class="pie">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>Fuente: Instituto Nacional de Medicina Legal y Ciencias Forenses · datos.gov.co</span>
      <span>Minería de Datos · Grupo 10</span>
    </div>
  </footer>

  <button class="btn-subir" type="button" aria-label="Volver arriba"><i class="bi bi-arrow-up"></i></button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
